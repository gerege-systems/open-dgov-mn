name: CI

# Алхамууд нь цөмийнх — хуулсан биш, дуудсан. Цөмийн шинэ гаралт энд л
# цуурхал байхаа болино: go.mod-ын нэг мөр хөдөлмөгц энэ нь open.dgov.mn
# түүн дээр компайл хийгдсэн хэвээр эсэхийг хариулна.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: gerege-systems/open-gerege-nexus/.github/workflows/distribution-ci.yml@main

# open.dgov.mn — Цахим Засаг.
#
# Upstream портууд нь цөмийн docker-compose.prod.yml-ийн анхдагчид, зөвхөн
# loopback дээр нийтлэгддэг: 3008 бүрхүүл, 8082 API. .env дотор
# BACKEND_HOST_PORT / FRONTEND_HOST_PORT-ыг өөрчилвөл энэ файл хамт өөрчлөгдөнө.
#
# server_name нь яг нэг хост. dgov.mn ба sso.dgov.mn ижил IP рүү заадаг тул
# `default_server` ч, wildcard ч биш байх нь заавал: хөршийнхөө урсгалыг
# залгичихна.
#
# Энэ файлыг certbot-оос ӨМНӨ суулгана. Certbot үүнийг өөрөө засаж `listen 443
# ssl` мөрүүд, 80 → https чиглүүлэгч блокийг нэмнэ. Тэдгээрийг гараар бичих
# хэрэггүй — сунгалт нь өөрийнхөө тэмдэглэгээг олохоо болино.
limit_req_zone $binary_remote_addr zone=dgov_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=dgov_oauth:10m rate=30r/m;

server {
    listen 80;
    server_name open.dgov.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # API нь эдгээрийг өөрийн хариудаа тавьдаг, бүрхүүлийн upstream нэгийг
        # нь ч тавьдаггүй — хүний харж буй дэлгэц бүр clickjacking, MIME
        # sniffing-ийн хамгаалалтгүй ирнэ. server түвшинд биш яг энд байгаа нь:
        # nginx тэгвэл API-гийн өөрийнх дээр хоёр дахь хуулбарыг нэмнэ, давхардсан
        # X-Frame-Options-ыг зарим хөтөч бүхэлд нь хаядаг.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Байрлуулалтын өөрийн лого, icon. Зөвхөн /opt/open-dgov-mn/brand/ доторх
    # файлууд — BRAND_LOGO_URL нь үүн рүү заана. Хоосон бол энэ хэсэг зүгээр л
    # 404 хариулж, бүрхүүл образынхаа зургийг үзүүлнэ.
    location /brand/ {
        alias /opt/open-dgov-mn/brand/;
        access_log off;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll нь 25 секунд онгорхой байдаг long poll. Анхдагч 60s
        # багтаах ч хэн нэгэн сохроор чангалахгүйн тулд бичив.
        proxy_read_timeout 90s;
    }

    # Хязгаарлалт нь орох цэг дээрээ байх нь: API-гийн хуулбар нэмэгдэхэд
    # халдагчийн нууц үг таах төсөв хамт үржих ёсгүй.
    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=dgov_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Домэйны үндэс дээр OIDC-ийн үлдсэн бүх зам. Snippet-ийг цөмийн репогоос
    # deploy.sh татаж /etc/nginx/snippets/ дотор тавина: энэ суулгац нь
    # sso.dgov.mn-ий клиент боловч өөрөө өөрийн дээрээ суусан аппуудад
    # identity тарааж өгсөн хэвээр — SSO_FEDERATION.md-ийн гурав дахь мөр.
    include snippets/nexus-oauth.conf;

    location = /oauth2/token {
        limit_req zone=dgov_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
